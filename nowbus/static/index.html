<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#111417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NowBus">
<title>NowBus</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<!-- ?v= 는 캐시 버스터다. 폰 브라우저가 옛 app.js 를 계속 내주는 일이 실제로
     있었다. UI 를 고치면 이 숫자와 sw.js 의 VERSION, 아래 build 표시를 같이 올린다. -->
<link rel="stylesheet" href="/style.css?v=2">
</head>
<body>

<!-- ① 목적지 선택 -->
<main id="home" class="screen">
  <header class="home-head">
    <h1>NowBus <span class="build">v2</span></h1>
    <p id="gps" class="gps">위치 확인 중…</p>
  </header>

  <p class="ask">어디로 가세요?</p>
  <div id="places" class="places"></div>

  <button id="add-place" class="btn ghost">+ 장소 추가</button>
  <button id="edit-token" class="link">토큰 설정</button>
</main>

<!-- ② 결과 -->
<main id="result" class="screen" hidden>
  <header class="result-head">
    <button id="back" class="back" aria-label="뒤로">←</button>
    <div class="trip">
      <strong id="trip-label">—</strong>
      <span id="freshness" class="fresh">—</span>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <!-- 걸어선 놓치지만 뛰면 잡히는 버스. 본 목록과 섞지 않는다. -->
  <section id="sprint-box" class="sprint-box" hidden>
    <h2 class="sprint-title">지금 뛰면 잡을 수 있어요</h2>
    <div id="sprint" class="cards"></div>
  </section>

  <p id="composition" class="composition" hidden></p>
  <div id="cards" class="cards" aria-live="polite"></div>

  <button id="refresh" class="btn refresh">새로고침</button>
</main>

<!-- ③ 장소 검색해서 추가 -->
<main id="search" class="screen" hidden>
  <header class="result-head">
    <button id="search-back" class="back" aria-label="뒤로">←</button>
    <div class="trip"><strong>장소 추가</strong></div>
  </header>

  <form id="search-form" class="search-form">
    <input id="search-q" type="search" inputmode="search" enterkeyhint="search"
           autocomplete="off" placeholder="장소 이름·주소 (예: 서울시청)" />
    <button class="btn" type="submit">검색</button>
  </form>

  <button id="use-here" class="btn ghost">현재 위치를 장소로 저장</button>
  <div id="hits" class="hits" aria-live="polite"></div>
</main>

<script src="/app.js?v=2"></script>
</body>
</html>
